# 이 파일을 configs/channels.local.yaml로 복사해 로컬 설정에 맞게 수정합니다.
# 실제 토큰, API 키, 계정별 비밀값은 커밋하지 않습니다.

language: ko
timezone: Asia/Tokyo

telegram:
  channel_naming: agent_team_name
  team_channels:
    broadcasting:
      channel_name: broadcasting
      chat_id_env: TELEGRAM_BROADCASTING_CHAT_ID
      description: 콘텐츠 메모와 링크를 입력하면 블로그, LinkedIn, Telegram 채널용 콘텐츠 생성과 승인/배포 보고를 처리하는 콘텐츠배포팀 채널입니다.
  input_chat_env: TELEGRAM_BROADCASTING_CHAT_ID
  report_chat_env: TELEGRAM_BROADCASTING_CHAT_ID
  approval_chat_env: TELEGRAM_BROADCASTING_CHAT_ID
  allowed_user_ids_env: TELEGRAM_ALLOWED_USER_IDS

broadcasting:
  default_input_source: telegram
  input_mode: natural_message
  link_detection: auto
  default_target_channels:
    - blog
    - linkedin
    - telegram
  save_drafts: true
  save_final_outputs: true
  quality_gate:
    pass_score: 90
    revise_score: 80
    max_revision_loops: 3
  channels:
    blog:
      enabled: true
      provider: tistory
      auto_publish: true
      require_approval: false
      publish_mode: public
      note: 티스토리 Open API가 아니라 Playwright 브라우저 자동화로 공개 발행합니다.
    linkedin:
      enabled: true
      provider: linkedin_posts_api
      auto_publish: true
      require_approval: false
      depends_on:
        - blog
      note: 티스토리 공개 발행 URL을 받은 뒤 [블로그 링크]를 실제 URL로 치환해 Posts API로 공개 게시합니다.
    telegram:
      enabled: true
      auto_publish: true
      require_approval: false
