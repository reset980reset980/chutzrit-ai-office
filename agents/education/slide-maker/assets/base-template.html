<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{강의명}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css">
  <style>
    :root {
      --bg:        #0d1117;
      --bg-card:   #161b22;
      --bg-code:   #1e2430;
      --bg-inset:  #252d3a;
      --text:      #e6edf3;
      --text-dim:  #8b949e;
      --text-muted:#484f58;
      --teal:      #2DD4BF;
      --orange:    #FF6D3B;
      --yellow:    #F0B429;
      --purple:    #A78BFA;
      --green:     #4ADE80;
      --border:        rgba(255,255,255,0.08);
      --border-teal:   rgba(45,212,191,0.25);
      --border-orange: rgba(255,109,59,0.25);
      --border-purple: rgba(167,139,250,0.25);
      --dot:  rgba(255,255,255,0.055);
      --ease: 0.36s cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(12px, 1.35vw, 15px);
      background: var(--bg);
      color: var(--text);
    }
    body { overflow: hidden; }

    /* ── 슬라이드 덱 ── */
    .slide-deck { position: fixed; inset: 0; }
    .slide {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 26px 26px;
      background-color: var(--bg);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(2.5rem,5.5vh,4.5rem) clamp(3.5rem,9vw,8rem);
      gap: clamp(1.5rem,3.75vh,3rem);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--ease);
    }
    .slide.active { opacity: 1; pointer-events: auto; }

    /* ── 헤더 ── */
    .slide__header {
      display: flex; flex-direction: column; gap: 0.7rem;
      padding-bottom: clamp(0.9rem,2.2vh,1.6rem);
      border-bottom: 1px solid var(--border);
    }
    .slide__label {
      font-size: clamp(0.58rem,0.85vw,0.72rem); font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal);
    }
    .slide__title {
      font-size: clamp(2rem,5.2vw,3.8rem); font-weight: 800;
      line-height: 1.08; letter-spacing: -0.015em;
    }
    .slide__title .hl        { color: var(--teal); }
    .slide__title .hl-orange { color: var(--orange); }
    .slide__title .hl-purple { color: var(--purple); }
    .slide__sub {
      font-size: clamp(1rem,1.65vw,1.15rem); font-weight: 400;
      color: var(--text-dim); line-height: 1.5;
    }

    /* ── 바디 ── */
    .slide__body {
      overflow: hidden; display: flex; flex-direction: column;
      gap: clamp(1.2rem,2.7vh,2.1rem); min-height: 0;
    }
    .slide__body > .grid-2     { flex: 1; min-height: 0; align-items: stretch; }
    .slide__body > .grid-35-65 { flex: 1; min-height: 0; }
    .slide__body > .code-col   { flex: 1; min-height: 0; }

    /* ── 코드 컬럼 ── */
    .code-col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .code-col > pre { flex: 1; min-height: 0; max-height: none; }
    .card pre { max-height: clamp(8rem,18vh,14rem); }

    /* ── 푸터 ── */
    .slide__footer {
      border-top: 1px solid var(--border);
      padding-top: clamp(0.5rem,1.3vh,0.9rem);
      display: flex; align-items: center;
      font-size: clamp(0.58rem,0.85vw,0.7rem); font-weight: 400;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
    }

    /* ── 타이포그래피 ── */
    .display {
      font-family: 'GmarketSans','Pretendard',sans-serif;
      font-size: clamp(2.8rem,7vw,5.5rem); font-weight: 900;
      line-height: 1.0; letter-spacing: -0.03em;
    }
    .h2 { font-size: clamp(1.3rem,2.8vw,2.1rem); font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
    .body-text { font-size: clamp(1.1rem,2.1vw,1.5rem); line-height: 1.65; color: var(--text); }
    .caption   { font-size: clamp(0.9rem,1.45vw,1.15rem); line-height: 1.5; color: var(--text-dim); }
    .dim   { color: var(--text-dim) !important; }
    .muted { color: var(--text-muted) !important; }
    .kw         { color: var(--teal);   font-weight: 600; }
    .kw-orange  { color: var(--orange); font-weight: 600; }
    .kw-yellow  { color: var(--yellow); font-weight: 600; }
    .kw-purple  { color: var(--purple); font-weight: 600; }
    .kw-green   { color: var(--green);  font-weight: 600; }

    /* ── 인라인 코드 ── */
    code {
      font-family: 'Monaco','Menlo','Consolas',monospace; font-size: 0.85em;
      background: rgba(45,212,191,0.1); color: var(--teal);
      padding: 2px 6px; border-radius: 3px;
    }

    /* ── 코드 블록 ── */
    pre {
      font-family: 'Monaco','Menlo','Consolas',monospace;
      font-size: clamp(0.58rem,1.1vw,0.76rem); line-height: 1.72;
      background: var(--bg-code); border: 1px solid var(--border);
      border-radius: 4px; padding: 1rem 1.2rem; color: #c9d1d9;
      overflow-y: auto; overflow-x: hidden; white-space: pre-wrap; word-break: break-word;
    }
    pre .hl { display: block; background: rgba(45,212,191,0.07); border-left: 2px solid var(--teal); margin: 0 -1.2rem; padding: 0 1.2rem 0 calc(1.2rem - 2px); }
    pre .kw { color: #f87171; font-weight: normal; }
    pre .fn { color: #c4b5fd; font-weight: normal; }
    pre .st { color: #93c5fd; font-weight: normal; }
    pre .cm { color: #555f6e; font-style: italic; }
    pre .nm { color: #6ee7b7; font-weight: normal; }
    pre .op { color: #79c0ff; font-weight: normal; }

    /* ── 그리드 ── */
    .grid-2     { display: grid; grid-template-columns: 1fr 1fr;           gap: clamp(1.2rem,3vw,2.1rem); }
    .grid-3     { display: grid; grid-template-columns: 1fr 1fr 1fr;       gap: clamp(1.2rem,3vw,2.1rem); }
    .grid-4     { display: grid; grid-template-columns: repeat(4,1fr);     gap: clamp(0.9rem,1.8vw,1.5rem); }
    .grid-35-65 { display: grid; grid-template-columns: 35fr 65fr;         gap: clamp(3rem,7.5vw,7.5rem); }

    /* ── 카드 ── */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: clamp(1.3rem,2.7vw,2rem); }
    .card--teal   { border-left: 3px solid var(--teal);   background: rgba(45,212,191,0.05); }
    .card--orange { border-left: 3px solid var(--orange); background: rgba(255,109,59,0.05); }
    .card--green  { border-left: 3px solid var(--green);  background: rgba(74,222,128,0.05); }
    .card--purple { border-left: 3px solid var(--purple); background: rgba(167,139,250,0.05); }
    .card__label { font-size: 0.62em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--teal); margin-bottom: 0.8rem; }

    /* ── 번호 목록 ── */
    .num-list { list-style: none; display: flex; flex-direction: column; gap: 1.1rem; }
    .num-list li { display: flex; align-items: flex-start; gap: 1.35rem; font-size: clamp(1.1rem,2.1vw,1.5rem); line-height: 1.55; }
    .num-circle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.75em; height: 1.75em; min-width: 1.75em;
      border: 1.5px solid var(--teal); border-radius: 50%;
      font-size: 0.72em; font-weight: 700; color: var(--teal); margin-top: 0.06em; flex-shrink: 0;
    }
    .num-circle--orange { border-color: var(--orange); color: var(--orange); }
    .num-circle--purple { border-color: var(--purple); color: var(--purple); }
    .num-circle--green  { border-color: var(--green);  color: var(--green); }

    /* ── 솔로 번호 목록 (J패턴) ── */
    .num-list-solo { list-style: none; display: flex; flex-direction: column; justify-content: center; gap: clamp(2rem,4vh,3.5rem); height: 100%; }
    .num-list-solo li { display: flex; align-items: flex-start; gap: 2rem; font-size: clamp(1.4rem,2.8vw,2.1rem); font-weight: 600; line-height: 1.4; }
    .num-circle-lg {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.6em; height: 1.6em; min-width: 1.6em;
      border: 2px solid var(--teal); border-radius: 50%;
      font-size: 1em; font-weight: 800; color: var(--teal); flex-shrink: 0;
    }
    .num-circle-lg--orange { border-color: var(--orange); color: var(--orange); }
    .num-circle-lg--purple { border-color: var(--purple); color: var(--purple); }

    /* ── 불릿 목록 ── */
    .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 0.7rem; }
    .bullet-list li { display: flex; align-items: baseline; gap: 0.975rem; font-size: clamp(0.9rem,1.45vw,1.15rem); line-height: 1.6; }
    .bullet-list li::before      { content: '—'; color: var(--teal);   font-weight: 700; flex-shrink: 0; }
    .bullet-list li.ok::before   { content: '✓'; color: var(--green); }
    .bullet-list li.no::before   { content: '✕'; color: var(--orange); }
    .bullet-list li.note::before { content: '→'; color: var(--yellow); }
    .bullet-list code { white-space: nowrap; }

    /* ── 팁 ── */
    .tip {
      background: rgba(45,212,191,0.05); border: 1px solid rgba(45,212,191,0.18);
      border-radius: 3px; padding: 0.975rem 1.5rem;
      font-size: clamp(0.9rem,1.35vw,1.1rem); color: var(--text-dim); line-height: 1.6;
    }
    .tip::before { content: '→  '; color: var(--teal); font-weight: 700; }
    .divider { height: 1px; background: var(--border); }

    /* ── 섹션 전환 ── */
    .slide--section {
      display: flex; align-items: center; justify-content: center;
      padding: 0; background-image: none; background-color: #1A7A6E;
    }
    .section-menu { display: flex; flex-direction: column; gap: 2.1rem; }
    .section-item { font-size: clamp(1.2rem,2.4vw,1.8rem); font-weight: 400; color: rgba(255,255,255,0.45); display: flex; align-items: center; gap: 1.5rem; }
    .section-item--active { color: #ffffff; font-weight: 700; }
    .section-arrow { opacity: 0; }
    .section-item--active .section-arrow { opacity: 1; }

    /* ── 임팩트 스테이트먼트 ── */
    .slide--statement {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: clamp(3rem,8vh,7rem) clamp(5rem,14vw,13rem);
    }

    /* ── 좌우 분할 ── */
    .slide--split { display: flex; flex-direction: row; padding: 0; }
    .split-left { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1.8rem; padding: clamp(2.5rem,6vh,5rem) clamp(3rem,6vw,6rem); }
    .split-right { width: 48%; min-width: 48%; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: clamp(2.5rem,6vw,6rem); gap: 2.1rem; }
    .split-right--teal   { background: #0d2420; }
    .split-right--orange { background: #231408; }
    .split-right--purple { background: #1a1030; }
    .split__label { font-size: clamp(0.58rem,0.85vw,0.72rem); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); }
    .split__label--orange { color: var(--orange); }
    .split__label--purple { color: var(--purple); }
    .split__title { font-size: clamp(1.7rem,4.2vw,3rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.015em; }
    .split__title .hl        { color: var(--teal); }
    .split__title .hl-orange { color: var(--orange); }
    .split__title .hl-purple { color: var(--purple); }
    .panel-quote { font-family: 'GmarketSans','Pretendard',sans-serif; font-size: clamp(1.3rem,2.8vw,2.1rem); font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; color: var(--teal); }
    .panel-quote--orange { color: var(--orange); }
    .panel-quote--purple { color: var(--purple); }
    .panel-stat { font-family: 'GmarketSans','Pretendard',sans-serif; font-size: clamp(4rem,9.5vw,7rem); font-weight: 900; line-height: 1.0; letter-spacing: -0.04em; }

    /* ── 컬럼 카드 ── */
    .col-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: clamp(1.5rem,2.7vw,2.25rem); display: flex; flex-direction: column; gap: 0.975rem; }
    .col-card__num { display: inline-flex; align-items: center; justify-content: center; width: 1.9em; height: 1.9em; border: 1.5px solid var(--teal); border-radius: 50%; font-size: clamp(0.78rem,1.3vw,0.9rem); font-weight: 700; color: var(--teal); }
    .col-card__num--orange { border-color: var(--orange); color: var(--orange); }
    .col-card__num--purple { border-color: var(--purple); color: var(--purple); }
    .col-card__num--green  { border-color: var(--green);  color: var(--green); }
    .col-card__title { font-size: clamp(1.4rem,2.8vw,2rem); font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
    .col-card__body  { font-size: clamp(0.9rem,1.45vw,1.15rem); line-height: 1.6; color: var(--text-dim); }
    .grid-4 .col-card__title { font-size: clamp(1rem,1.8vw,1.45rem); }
    .grid-4 .col-card { padding: clamp(1rem,2vw,1.6rem); }

    /* ── 어젠다 ── */
    .agenda-list { list-style: none; display: flex; flex-direction: column; gap: clamp(0.9rem,1.8vh,1.5rem); }
    .agenda-list li { display: flex; align-items: baseline; gap: 1.2rem; font-size: clamp(1.1rem,2.1vw,1.5rem); font-weight: 500; line-height: 1.5; color: var(--text-dim); }
    .agenda-list li.active { color: var(--text); font-weight: 700; }
    .agenda-num { font-size: 0.72em; font-weight: 700; color: var(--text-muted); min-width: 2ch; flex-shrink: 0; }
    .agenda-list li.active .agenda-num { color: var(--teal); }

    /* ── 언어 그리드 ── */
    .lang-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: clamp(0.6rem,1.2vw,1rem); }
    .lang-tag { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 0.6rem 0.9rem; font-size: clamp(0.78rem,1.3vw,0.9rem); font-weight: 600; text-align: center; color: var(--text-dim); letter-spacing: 0.02em; }
    .lang-tag--teal   { border-color: var(--border-teal);            color: var(--teal);   background: rgba(45,212,191,0.06); }
    .lang-tag--orange { border-color: var(--border-orange);          color: var(--orange); background: rgba(255,109,59,0.06); }
    .lang-tag--purple { border-color: var(--border-purple);          color: var(--purple); background: rgba(167,139,250,0.06); }
    .lang-tag--green  { border-color: rgba(74,222,128,0.25);         color: var(--green);  background: rgba(74,222,128,0.06); }

    /* ── 고정 UI ── */
    .progress-bar { position: fixed; top: 0; left: 0; width: 100%; height: 2px; z-index: 200; background: rgba(255,255,255,0.04); user-select: none; }
    .progress-fill { height: 100%; background: var(--teal); transition: width 0.3s ease-out; }
    .nav-btn {
      position: fixed; top: 50%; z-index: 150; transform: translateY(-50%); user-select: none;
      width: clamp(1.9rem,2.8vw,2.5rem); height: clamp(1.9rem,2.8vw,2.5rem);
      background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 3px;
      color: var(--text-muted); font-size: 0.8rem; cursor: pointer; transition: all 0.18s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:hover { background: rgba(45,212,191,0.1); color: var(--teal); border-color: var(--border-teal); }
    .nav-btn:disabled { opacity: 0.08; cursor: not-allowed; }
    #btn-prev { left:  clamp(0.4rem,1.2vw,1.1rem); }
    #btn-next { right: clamp(0.4rem,1.2vw,1.1rem); }
    .dot-nav { position: fixed; bottom: 1.3rem; left: 50%; transform: translateX(-50%); z-index: 150; display: flex; gap: 5px; align-items: center; user-select: none; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.18); cursor: pointer; transition: all 0.22s ease; border: none; }
    .dot.active { width: 22px; border-radius: 3px; background: var(--teal); }
    .dot:hover:not(.active) { background: rgba(255,255,255,0.38); }
    .slide-counter { position: fixed; bottom: 1.2rem; right: 1.8rem; z-index: 150; font-family: 'Monaco',monospace; font-size: 0.62em; color: var(--text-muted); letter-spacing: 0.07em; user-select: none; }
  </style>
</head>
<body>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<button class="nav-btn" id="btn-prev" aria-label="이전 슬라이드">&#8592;</button>
<button class="nav-btn" id="btn-next" aria-label="다음 슬라이드">&#8594;</button>
<div class="dot-nav" id="dot-nav"></div>
<div class="slide-counter"><span id="cur">1</span> / <span id="tot">{{TOTAL}}</span></div>

<div class="slide-deck" id="deck">

  <!-- 슬라이드를 여기에 추가 -->

</div>

<script>
class SlidePresentation {
  constructor() {
    this.slides      = Array.from(document.querySelectorAll('.slide'));
    this.total       = this.slides.length;
    this.current     = 0;
    this.isAnimating = false;
    this._tx = 0; this._ty = 0;
    this._init();
  }
  _init() {
    document.getElementById('tot').textContent = this.total;
    this._buildDots(); this._bindKeys(); this._bindTouch(); this._bindButtons(); this._update();
  }
  next() { if (!this.isAnimating) this._go(this.current + 1); }
  prev() { if (!this.isAnimating) this._go(this.current - 1); }
  _go(i) {
    if (i < 0 || i >= this.total || i === this.current || this.isAnimating) return;
    this.isAnimating = true;
    this.slides[this.current].classList.remove('active');
    this.slides[i].classList.add('active');
    this.current = i;
    this.slides[i].addEventListener('transitionend', () => { this.isAnimating = false; this._update(); }, { once: true });
    setTimeout(() => { this.isAnimating = false; this._update(); }, 500);
    this._update();
  }
  _update() {
    const pct = (this.current + 1) / this.total * 100;
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('cur').textContent = this.current + 1;
    document.getElementById('btn-prev').disabled = this.current === 0;
    document.getElementById('btn-next').disabled = this.current === this.total - 1;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === this.current));
  }
  _buildDots() {
    const nav = document.getElementById('dot-nav');
    this.slides.forEach((_, i) => {
      const b = document.createElement('button');
      b.className = 'dot' + (i === 0 ? ' active' : '');
      b.setAttribute('aria-label', `슬라이드 ${i + 1}`);
      b.addEventListener('click', () => { if (!this.isAnimating) this._go(i); });
      nav.appendChild(b);
    });
  }
  _bindKeys() {
    document.addEventListener('keydown', e => {
      if (this.isAnimating) return;
      switch (e.key) {
        case 'ArrowRight': case ' ': e.preventDefault(); this.next(); break;
        case 'ArrowLeft':            e.preventDefault(); this.prev(); break;
        case 'Home': e.preventDefault(); this._go(0);              break;
        case 'End':  e.preventDefault(); this._go(this.total - 1); break;
      }
    });
  }
  _bindTouch() {
    const deck = document.getElementById('deck');
    deck.addEventListener('touchstart', e => { this._tx = e.changedTouches[0].screenX; this._ty = e.changedTouches[0].screenY; }, { passive: true });
    deck.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - this._tx;
      const dy = e.changedTouches[0].screenY - this._ty;
      if (Math.abs(dy) > Math.abs(dx) || Math.abs(dx) < 50 || this.isAnimating) return;
      dx < 0 ? this.next() : this.prev();
    }, { passive: true });
  }
  _bindButtons() {
    document.getElementById('btn-prev').addEventListener('click', () => this.prev());
    document.getElementById('btn-next').addEventListener('click', () => this.next());
  }
}
new SlidePresentation();
</script>
</body>
</html>
